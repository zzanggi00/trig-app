<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>삼각함수 개념 탐구 웹 앱</title>
  <link rel="stylesheet" href="assets/common.css" />
  <style>
    .hero-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .hero-head h1 {
      margin: 0;
    }

    .hero-test-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .hero-test-btn:hover {
      background: #f8fafc;
    }

    .hero-test-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .test-wrap {
      display: none;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: white;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
    }

    .test-wrap.open { display: block; }

    .test-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .test-head strong { font-size: 17px; }

    .test-close-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }

    #testFrame {
      width: 100%;
      min-height: 760px;
      border: 0;
      display: block;
      background: white;
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div class="hero-head">
        <h1>삼각함수 개념 탐구 웹 앱(2022개정 교육과정 : 고등학교 2학년 대수)</h1>
        <button id="openTestBtn" type="button" class="hero-test-btn">1차시 테스트</button>
      </div>

      <div class="nav-grid">
        <a class="nav-btn active" data-page="page1" href="pages/page1.html" target="contentFrame">1.일반각</a>
        <a class="nav-btn" data-page="page2" href="pages/page2.html" target="contentFrame">2.호도법과 육십분법</a>
        <a class="nav-btn" data-page="page3" href="pages/page3.html" target="contentFrame">3.삼각함수의 정의</a>
        <a class="nav-btn" data-page="page4" href="pages/page4.html" target="contentFrame">4.삼각함수 간의 관계</a>
        <a class="nav-btn" data-page="page5" href="pages/page5.html" target="contentFrame">5.삼각함수의 그래프(사인)</a>
        <a class="nav-btn" data-page="page6" href="pages/page6.html" target="contentFrame">6.삼각함수의 그래프(코사인)</a>
        <a class="nav-btn" data-page="page7" href="pages/page7.html" target="contentFrame">7.삼각함수의 그래프(탄젠트)</a>
        <a class="nav-btn" data-page="page8" href="pages/page8.html" target="contentFrame">8.삼각함수의 그래프의 변형(사인)</a>
        <a class="nav-btn" data-page="page9" href="pages/page9.html" target="contentFrame">9.삼각함수의 그래프의 변형(코사인)</a>
        <a class="nav-btn" data-page="page10" href="pages/page10.html" target="contentFrame">10.삼각함수의 그래프 변형(탄젠트)</a>
      </div>
    </section>

    <div class="frame-wrap">
      <iframe
        id="contentFrame"
        name="contentFrame"
        src="pages/page1.html"
        title="페이지별 콘텐츠">
      </iframe>
    </div>

    <section id="testWrap" class="test-wrap" aria-label="차시별 학습 확인 테스트">
      <div class="test-head">
        <strong id="testTitle">1차시 학습 확인 테스트</strong>
        <button id="closeTestFrameBtn" type="button" class="test-close-btn">테스트 닫기</button>
      </div>
      <iframe id="testFrame" title="차시별 테스트" src="about:blank"></iframe>
    </section>
  </div>

 <script src="assets/common.js"></script>
<script>
  const frame = document.getElementById('contentFrame');
  const openTestBtn = document.getElementById('openTestBtn');
  const testWrap = document.getElementById('testWrap');
  const testFrame = document.getElementById('testFrame');
  const testTitle = document.getElementById('testTitle');
  const closeTestFrameBtn = document.getElementById('closeTestFrameBtn');

  const testMap = {
    page1: 'test1',
    page2: 'test2',
    page3: 'test3',
    page4: 'test4',
    page5: 'test5',
    page6: 'test6',
    page7: 'test7',
    page8: 'test8',
    page9: 'test9',
    page10: 'test10'
  };

  let currentPageId = 'page1';

  function updateTestButton() {
    if (testMap[currentPageId]) {
      openTestBtn.disabled = false;
      openTestBtn.textContent = `${currentPageId.replace('page', '')}차시 테스트`;
    } else {
      openTestBtn.disabled = true;
      openTestBtn.textContent = '현재 차시 테스트';
    }
  }

  function closeTestFrame() {
    testWrap.classList.remove('open');
    testFrame.src = 'about:blank';
  }

  function openCurrentTestFrame() {
    const testId = testMap[currentPageId];
    if (!testId) return;

    const lessonNo = currentPageId.replace('page', '');
    testTitle.textContent = `${lessonNo}차시 학습 확인 테스트`;
    testFrame.style.height = '760px';
    testFrame.src = `pages/${testId}.html`;
    testWrap.classList.add('open');

    requestAnimationFrame(() => {
      testWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  openTestBtn.addEventListener('click', openCurrentTestFrame);
  closeTestFrameBtn.addEventListener('click', closeTestFrame);

  // iframe 안의 페이지가 실제로 로드된 뒤 보내는 page 정보를 기준으로
  // 현재 차시와 테스트 버튼도 함께 동기화한다.
  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.page && testMap[data.page]) {
      currentPageId = data.page;
      updateTestButton();
    }
    if (data.type === 'setTestHeight' && event.source === testFrame.contentWindow) {
      const requestedHeight = Number(data.height);
      if (Number.isFinite(requestedHeight)) {
        // 테스트 내용에 맞춰 높이를 조절하되 무한 확대를 방지한다.
        // 최대 높이를 넘는 내용은 iframe 내부 스크롤로 확인한다.
        const nextHeight = Math.min(2600, Math.max(760, Math.ceil(requestedHeight)));
        const currentHeight = parseInt(testFrame.style.height, 10) || 760;
        if (Math.abs(currentHeight - nextHeight) > 1) {
          testFrame.style.height = `${nextHeight}px`;
        }
      }
    }
    if (data.type === 'closeTest') {
      closeTestFrame();
    }
  });

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const pageId = btn.dataset.page;
      if (pageId) {
        currentPageId = pageId;
        updateTestButton();
        closeTestFrame();
      }
    });
  });

  TrigCommon.setupFrameShell('contentFrame', '.nav-btn', 760);
  updateTestButton();
</script>


</body>
</html>
